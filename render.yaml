# La base Postgres est hébergée chez Neon, pas chez Render : les bases
# gratuites Render sont supprimées au bout de 30 jours.
services:
  - type: web
    name: ecoute-anonyme
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # Secrets à saisir manuellement lors de la création du Blueprint
      # (voir .env.example pour leur signification).
      - key: DATABASE_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: SITE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
